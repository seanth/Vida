description: >
  Two runs with the same -seed. Before each run the test driver seeds the
  random numbers differently, so the two runs only match because -seed
  resets them. test_seed_option_repeats_a_run_exactly checks they match.
species: [species/generic]
stages:
  - seed: 1601
    args: [-n, first, -w, "20", -s, "15", -t, "15", -m, "100", -seed, "42", -a, a, -f, n]
  - seed: 1602
    args: [-n, second, -w, "20", -s, "15", -t, "15", -m, "100", -seed, "42", -a, a, -f, n]
